version: "3.9"

services:
  api:
    build:
      context: .
      target: runtime
    image: breastcancer-api:latest
    container_name: bc_api
    ports:
      - "8000:8000"
    volumes:
      - ./weights:/app/weights:ro
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - MODEL_WEIGHTS=/app/weights/best_model.pt
      - PORT=8000
      - WORKERS=2
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      target: dashboard
    image: breastcancer-dashboard:latest
    container_name: bc_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./weights:/app/weights:ro
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - MODEL_WEIGHTS=/app/weights/best_model.pt
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: bc_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: bc_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=breastai2025
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana_data:
